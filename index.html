<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חלון לרוח – שאלון היכרות</title>
<style>
:root{
  --bg:#f3eddd;
  --paper:#FBF8F0;
  --sky:#8FB0D3;
  --sky-soft:#DCE6F0;
  --sand:#D6BC95;
  --ink:#24344D;
  --ink-soft:#5A6B82;
  --line:#CFC6B0;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;color:var(--ink);background:var(--bg);
  font-family:"Assistant","Heebo","Rubik","Arial Hebrew",Arial,sans-serif;
  font-size:18px;line-height:1.65;
}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 64px}
.hero{display:block;width:calc(100% + 40px);margin:0 -20px;height:auto}
@media(min-width:680px){.hero{width:100%;margin:0}}
.intro{text-align:center;padding:8px 8px 28px}
.intro h1{font-size:30px;line-height:1.3;font-weight:700;margin:0 0 10px;letter-spacing:0}
.intro p{margin:0 auto;max-width:30em;color:var(--ink-soft)}
form{display:flex;flex-direction:column;gap:26px}
.q{display:block}
.q label,.q .lbl{display:block;font-weight:600;font-size:18px;margin:0 4px 8px;color:var(--ink)}
.q .hint{display:block;font-weight:400;font-size:15px;color:var(--ink-soft);margin-top:2px}
textarea,input[type=text]{
  width:100%;font:inherit;color:var(--ink);
  background:var(--paper);
  border:1.5px solid var(--line);border-radius:18px;
  padding:14px 18px;resize:vertical;min-height:56px;
  transition:border-color .2s, box-shadow .2s, background .2s;
}
textarea{min-height:104px}
textarea::placeholder,input::placeholder{color:#A9A18C}
textarea:focus,input:focus{
  outline:none;border-color:var(--sky);background:#fff;
  box-shadow:0 0 0 4px var(--sky-soft);
}
.group-title{
  margin:14px 4px -6px;font-size:15px;color:var(--ink-soft);
  display:flex;align-items:center;gap:12px;
}
.group-title::after{content:"";flex:1;height:1px;background:var(--line)}
button{
  margin-top:8px;align-self:center;font:inherit;font-weight:700;font-size:19px;
  color:#fff;background:var(--ink);border:0;border-radius:999px;
  padding:14px 48px;cursor:pointer;transition:background .2s, transform .1s;
}
button:hover{background:#34496b}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
button[disabled]{opacity:.6;cursor:wait}
.err{color:#9a3b2e;text-align:center;min-height:1.2em;font-size:16px}
.thanks{display:none;text-align:center;padding:40px 12px}
.thanks h2{font-size:28px;margin:0 0 8px}
.thanks p{color:var(--ink-soft);margin:0}
.sand-line{height:6px;width:64px;background:var(--sand);border-radius:6px;margin:0 auto 22px}
.hp{position:absolute;left:-9999px;opacity:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <section class="intro" id="intro">
    <div class="sand-line"></div>
    <h1>שמחות שאת איתנו</h1>
    <p>כמה מילים עלייך, ונכיר אותך קצת לפני שניפגש. אין תשובות נכונות או לא נכונות, ואפשר לכתוב כמה שנעים לך.</p>
  </section>

  <form id="f" novalidate>
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="group-title">קצת עלייך</div>

    <div class="q"><label for="name">שם</label>
      <input id="name" name="שם" type="text" required autocomplete="name"></div>

    <div class="q"><label for="bd">תאריך לידה</label>
      <input id="bd" name="תאריך לידה" type="text" inputmode="numeric" placeholder="לדוגמה 14.3.1990"></div>

    <div class="q"><label for="city">מקום מגורים</label>
      <input id="city" name="מקום מגורים" type="text"></div>

    <div class="q"><label for="fam">מצב משפחתי</label>
      <textarea id="fam" name="מצב משפחתי" rows="3"></textarea></div>

    <div class="q"><label for="work">מה את עושה בחיים?</label>
      <textarea id="work" name="מה את עושה בחיים" rows="3"></textarea></div>

    <div class="group-title">הדרך שלך</div>

    <div class="q"><label for="faith">איפה את ממוקמת על הרצף הדתי, והאם את אחת שיש לה אלוהים?</label>
      <textarea id="faith" name="הרצף הדתי ואלוהים" rows="3"></textarea></div>

    <div class="q"><label for="good">האנשים שקרובים אלייך יגידו שאת טובה ב...</label>
      <textarea id="good" name="טובה ב" rows="3"></textarea></div>

    <div class="q"><label for="bad">האנשים שקרובים אלייך יגידו שאת גרועה ב...</label>
      <textarea id="bad" name="גרועה ב" rows="3"></textarea></div>

    <div class="group-title">לקראת האירוע</div>

    <div class="q"><label for="why">למה באת לחלון לרוח? מה חשוב לך לקבל?</label>
      <textarea id="why" name="למה באת ומה חשוב לקבל" rows="3"></textarea></div>

    <div class="q"><label for="emily">משהו שחשוב שאמילי תדע עליי</label>
      <textarea id="emily" name="משהו שחשוב שאמילי תדע" rows="3"></textarea></div>

    <div class="err" id="err" role="alert"></div>
    <button type="submit" id="send">שליחה</button>
  </form>

  <section class="thanks" id="thanks" aria-live="polite">
    <div class="sand-line"></div>
    <h2>תודה ששיתפת</h2>
    <p>התשובות שלך התקבלו. נתראה בקרוב.</p>
  </section>
</div>

<script>
// הדביקי כאן את כתובת ה-Web App של Google Apps Script (ראי הוראות בקובץ השני)
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyLlpmFEWZroG39G7WuCcpHor5r9fjsbOvr31KlxAOOcHOuHxfIf5Y2Z3EiH3qoZnQjrA/exec";

const f = document.getElementById('f');
const err = document.getElementById('err');
const send = document.getElementById('send');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  if (!f.name.value.trim()) { err.textContent = 'נשמח לדעת איך קוראים לך'; f.name.focus(); return; }
  if (f.website.value) return; // honeypot
  if (!ENDPOINT) { err.textContent = 'השאלון עדיין לא מחובר לגיליון (חסרה כתובת ENDPOINT)'; return; }

  const data = new URLSearchParams();
  [...f.elements].forEach(el => {
    if (el.name && el.name !== 'website') data.append(el.name, el.value.trim());
  });

  send.disabled = true; send.textContent = 'שולחת...';
  try {
    await fetch(ENDPOINT, { method:'POST', mode:'no-cors', body:data });
    f.style.display = 'none';
    document.getElementById('intro').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
  } catch (x) {
    err.textContent = 'משהו השתבש בשליחה. נסי שוב בעוד רגע';
    send.disabled = false; send.textContent = 'שליחה';
  }
});
</script>
